# ── Reachy Mini Voice Assistant — Jetson Thor ────────────────────────────
#
# Runs the voice AI on Jetson. Connect to a Reachy Mini daemon running
# elsewhere — either the real robot or MuJoCo sim on your laptop.
#
# On Jetson:
#   docker compose up -d
#   docker compose logs -f reachy    # wait ~5min for vLLM to load
#
# On your laptop (simulation):
#   pip install reachy-mini[mujoco]
#   reachy-mini-daemon --sim
#
# Tip: Run "sudo sysctl -w vm.drop_caches=3" before starting
#       to reclaim GPU memory from previous runs.

x-common: &common
  runtime: nvidia
  network_mode: host
  ipc: host
  restart: unless-stopped
  ulimits:
    memlock: -1
    stack: 67108864

volumes:
  hf-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}

services:
  # ── VLM: vLLM Qwen2.5-VL-7B NVFP4 on Thor ──────────────────────────
  vllm:
    <<: *common
    image: ghcr.io/nvidia-ai-iot/vllm:latest-jetson-thor
    container_name: reachy-vllm
    volumes:
      - hf-cache:/root/.cache/huggingface
    command: >
      vllm serve nvidia/Qwen2.5-VL-7B-Instruct-NVFP4
      --host 0.0.0.0 --port 8001
      --max-model-len 4096
      --gpu-memory-utilization 0.3
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  # ── Reachy voice assistant (waits for vLLM to be healthy) ────────────
  reachy:
    <<: *common
    image: ghcr.io/amarrmb/reachy-mini:thor
    build: .
    container_name: reachy-assistant
    devices:
      - /dev/snd
    volumes:
      - hf-cache:/root/.cache/huggingface
      - /usr/lib/aarch64-linux-gnu:/host-libs:ro        # Jetson NVPL + cuDNN
      - /usr/local/cuda:/usr/local/cuda:ro              # CUDA toolkit
      - ${HOME}/.asoundrc:/root/.asoundrc:ro            # Use host ALSA default (Jabra)
    environment:
      - TORCH_COMPILE_DISABLE=1
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:/host-libs:/host-libs/libcudss/13:/usr/local/cuda/lib64:/usr/local/cuda/compat
      - REACHY_HOST=${REACHY_HOST:-}    # Set to laptop/robot IP for remote daemon
    depends_on:
      vllm:
        condition: service_healthy
