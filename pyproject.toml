[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "reachy-mini-voice"
version = "0.1.0"
description = "Voice + vision AI brain for Reachy Mini robots on NVIDIA Jetson"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "reachy-mini[mujoco]",
    "Pillow",
]

[project.urls]
Homepage = "https://github.com/baskd/reachy-mini"
Repository = "https://github.com/baskd/reachy-mini"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
