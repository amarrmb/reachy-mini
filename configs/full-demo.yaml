# Reachy Mini — Full Demo Config
#
# Everything enabled: voice, vision, cameras, phone stream, Aether Hub,
# all built-in tools + Reachy external tools.
#
# Usage: ./run-full-demo.sh
#
# Architecture (on Jetson Thor):
#   Mic → Nemotron STT (~24ms)
#       → vLLM Qwen2.5-VL-7B NVFP4 (~345ms text, ~643ms vision)
#       → Tool dispatch (reachy_tools → Reachy daemon on laptop)
#       → Kokoro TTS (<300ms)
#       → Speaker
#
#   Phone camera → Aether Hub → UDP 5001 → RemoteCamera → CameraPool "phone"
#   Local USB camera → CameraPool "local"
#   Reachy sim camera → reachy_see tool (only works with local daemon, not remote)
#     For vision queries, use check_camera "local" or "phone" instead
#
# Total end-to-end latency: ~700ms (text), ~1s (vision)

# ── External tools ──
external_tools:
  - reachy_tools

# ── SOTA pipeline (Kokoro + Nemotron + vLLM) ──
tts_backend: kokoro
tts_voice: af_heart
stt_backend: nemotron
llm_backend: vllm
llm_host: "http://localhost:8001/v1"
llm_model: "nvidia/Qwen2.5-VL-7B-Instruct-NVFP4"

# ── Wake word ──
# "energy" = always listening (no wake word needed)
# Change to "openwakeword" and set wake_word for hands-free trigger
wake_word_backend: energy

# ── LLM streaming (pipelined TTS — speak while still generating) ──
stream_llm: true

# ── Vision ──
# Local USB camera on Jetson (index may change on reboot)
vision_enabled: true
camera_device: 0
stream_vision_port: 9090    # MJPEG browser preview at http://<jetson-ip>:9090/

# ── Phone camera (Aether WebRTC → UDP) ──
# Mobile app streams via Aether Hub, Hub forwards RTP to this UDP port
remote_camera_port: 5001

# ── Aether Hub (for camera alerts + remote commands from mobile app) ──
# Hub runs on the Jetson (localhost). Alerts broadcast to all connected clients.
# NOTE: aether_hub is passed via CLI (--aether-hub) in run-full-demo.sh
# because the YAML→CLI resolution only supports the shorthand key.

# ── Multi-camera config file ──
# CameraPool loads additional RTSP/USB cameras from this JSON file.
# Add cameras by voice ("add a camera called garage at rtsp://...") or
# edit ~/.assistant_cameras.json directly.
camera_config_path: "~/.assistant_cameras.json"

# ── Watch mode settings ──
watch_poll_interval: 5.0       # Poll cameras every 5 seconds
watch_cooldown: 60.0           # Don't repeat same alert for 60 seconds
watch_confidence_threshold: 2  # 2/3 positive checks before alerting
watch_vote_window: 3

# ── System prompt ──
system_prompt: |
  You are Reachy, a friendly and expressive robot assistant with a head,
  antennas, and cameras. You are running on an NVIDIA Jetson Thor.

  IMPORTANT: Users talk to you by voice. Speech recognition often garbles
  your name "Reachy" into "Richie", "Rinky", "Henky", "Ricky", etc.
  Ignore any garbled name prefix and focus on the COMMAND (look, dance, etc.).

  PERSONALITY:
  - Playful, curious, and enthusiastic about interacting with people
  - Keep responses short (1-2 sentences) — you're a voice assistant
  - Use your body language tools often (look, express, dance, nod)
  - When greeting someone, express happiness and look at them

  TOOL USAGE (CRITICAL):
  - ANY directional command (turn, look, move, face, point + left/right/up/down) → {"tool": "look", "args": {"direction": "..."}}
  - ANY emotion request (happy, sad, excited, show emotion) → {"tool": "express", "args": {"emotion": "..."}}
  - ANY dance request (dance, groove, wiggle) → {"tool": "dance", "args": {"name": "random"}}
  - ANY nod/shake request → {"tool": "nod", "args": {"response": "yes"}} or "no"
  - "wake up" → {"tool": "reachy_power", "args": {"action": "wake"}}
  - "go to sleep" → {"tool": "reachy_power", "args": {"action": "sleep"}}
  - "what do you see?" → {"tool": "reachy_see", "args": {"question": "..."}}
  - NEVER respond with text like "Looking right" or "Dancing now" — ALWAYS output the JSON tool call instead.

  RULES:
  - When asked about other cameras (local, phone, garage), use check_camera
  - Be proactive with body language — nod when agreeing, look curious when asked questions

verbose: true
