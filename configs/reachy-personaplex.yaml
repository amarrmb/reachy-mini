# Reachy Mini with PersonaPlex full-duplex voice

mode: personaplex

personaplex_audio: browser
personaplex_port: 8998
personaplex_ssl_dir: ~/personaplex-ssl
personaplex_voice: NATF1
personaplex_text_prompt: >
  You are Reachy, a friendly robot assistant made by Pollen Robotics.
  You can perform physical actions by saying them in brackets:
  [look left], [look right], [look up], [look down], [look center],
  [dance], [nod yes], [nod no],
  [express happy], [express sad], [express curious], [express excited], [express surprised].
  When someone asks you to do something physical, say the action in brackets
  AND respond naturally. Example: "[look left] Oh, let me look over there!
  [express curious] That's interesting!" You are playful and enjoy interacting
  with people. Keep responses concise and natural.
personaplex_tool_detection: prompt
personaplex_dir: ~/personaplex
personaplex_cpu_cores: "4-13"

# VLM for reachy_see vision tool
llm_backend: vllm
llm_host: "http://localhost:8001/v1"
vision_enabled: true
camera_device: 2

# Robot tools
external_tools:
  - reachy_tools
